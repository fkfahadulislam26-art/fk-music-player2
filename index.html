<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="A modern offline-ready music player PWA">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <title>Music Player</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">YOUR MUSIC</p>
        <h1>Music Player</h1>
      </div>
      <button id="installBtn" class="icon-btn" title="Install app" hidden>＋</button>
    </header>

    <main>
      <section class="hero">
        <div class="cover" id="cover">
          <span>♪</span>
        </div>
        <div class="track-info">
          <p class="eyebrow">NOW PLAYING</p>
          <h2 id="title">No song selected</h2>
          <p id="artist">Choose a song from your library</p>
        </div>
      </section>

      <section class="player-card">
        <audio id="audio" preload="metadata"></audio>
        <div class="progress-row">
          <span id="currentTime">0:00</span>
          <input id="progress" type="range" min="0" max="100" value="0" aria-label="Song progress">
          <span id="duration">0:00</span>
        </div>

        <div class="controls">
          <button id="shuffleBtn" class="control-btn" title="Shuffle">🔀</button>
          <button id="prevBtn" class="control-btn" title="Previous">⏮</button>
          <button id="playBtn" class="play-btn" title="Play">▶</button>
          <button id="nextBtn" class="control-btn" title="Next">⏭</button>
          <button id="repeatBtn" class="control-btn" title="Repeat">🔁</button>
        </div>

        <div class="volume-row">
          <span>🔊</span>
          <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
        </div>
      </section>

      <section class="library">
        <div class="section-heading">
          <div>
            <p class="eyebrow">LIBRARY</p>
            <h2>Your Songs</h2>
          </div>
          <label class="add-btn">
            Add Music
            <input id="fileInput" type="file" accept="audio/*" multiple hidden>
          </label>
        </div>

        <div class="search-wrap">
          <input id="search" type="search" placeholder="Search songs..." aria-label="Search songs">
        </div>

        <div id="songList" class="song-list"></div>
        <p id="emptyState" class="empty">No songs yet. Click “Add Music” to select audio files.</p>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
